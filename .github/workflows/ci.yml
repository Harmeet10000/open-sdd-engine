name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-verify:
    name: Go verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.x
          check-latest: true
          cache: false

      - name: Verify
        run: make verify

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Analysis tools follow the current Go export-data format independently
      # of the module's minimum supported Go version in go.mod.
      - name: Set up analysis toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false

      - name: Install pinned analysis tools
        env:
          GOFLAGS: -mod=mod
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Static analysis
        env:
          GOFLAGS: -mod=readonly
        run: staticcheck ./...

  vulnerability-scan:
    name: Reachable vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # govulncheck v1.1.4 predates Go 1.27 export data. Keep the scanner on
      # the newest patch of the module's supported 1.24 toolchain.
      - name: Set up vulnerability-analysis toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.x
          check-latest: true
          cache: false

      - name: Install pinned vulnerability scanner
        env:
          GOFLAGS: -mod=mod
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Reachable vulnerability scan
        env:
          GOFLAGS: -mod=readonly
        run: govulncheck ./...
