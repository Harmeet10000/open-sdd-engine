name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  contribution-policy:
    name: Contribution policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum

      - name: Validate pull-request title
        env:
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}
        run: go run ./internal/tools/commitlint -message "$COMMIT_MESSAGE"

      - name: Validate commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run ./internal/tools/commitlint -base "$BASE_SHA" -head "$HEAD_SHA"

  source-quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Check module integrity
        run: make mod-check

      - name: Resolve package graph
        run: make list

      - name: Vet packages
        run: make vet

      - name: Install workflow validator
        env:
          GOFLAGS: -mod=mod
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate workflows
        run: make actionlint

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "1.27.2"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: make test-current

  platform-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -count=1 -shuffle=on ./...

  race-and-coverage:
    name: Race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum

      - name: Race detector
        run: make race

      - name: Coverage threshold
        run: make coverage

  smoke:
    name: Native runtime smoke (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum

      - name: Build with fixed metadata
        run: >-
          go build -mod=readonly -trimpath
          -ldflags "-X main.version=0.1.0-test -X main.commit=test -X main.buildTime=1970-01-01T00:00:00Z"
          -o "${{ runner.temp }}/sdd" ./cmd/sdd

      - name: Smoke the native binary with absolute paths
        run: |
          set -euo pipefail
          BIN="${{ runner.temp }}/sdd"
          "$BIN" --version
          EMPTY="$(mktemp -d)"
          cd "$EMPTY"
          "$BIN" version --json
          code=0; "$BIN" status || code=$?
          test "$code" -eq 3
          code=0; "$BIN" doctor || code=$?
          test "$code" -eq 3
          code=0; "$BIN" bogus || code=$?
          test "$code" -eq 2
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/.sdd/work/apple"
          printf 'formatVersion: 1\nworkspaceId: ws-1\nrevision: 11\n' > "$WORK/.sdd/workspace.yaml"
          printf 'schemaVersion: 1\nworkId: work-1\nslug: apple\nrevision: 5\nstatus: active\ncomposition: quick-spec\n' > "$WORK/.sdd/work/apple/work.yaml"
          cd "$WORK"
          "$BIN" status
          "$BIN" doctor --json
          "$BIN" start --dry-run "smoke intent" --json

  cross-build:
    name: Cross-compile only (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum

      - name: Compile without runtime claims
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -mod=readonly -trimpath ./...

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum

      - name: Build twice with fixed inputs and compare
        run: |
          set -euo pipefail
          FLAGS='-mod=readonly -trimpath -ldflags "-X main.version=0.1.0-test -X main.commit=test -X main.buildTime=1970-01-01T00:00:00Z"'
          go build $FLAGS -o "${{ runner.temp }}/sdd-a" ./cmd/sdd
          go build $FLAGS -o "${{ runner.temp }}/sdd-b" ./cmd/sdd
          cmp "${{ runner.temp }}/sdd-a" "${{ runner.temp }}/sdd-b"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

  required:
    name: Required checks
    if: always()
    needs:
      - contribution-policy
      - source-quality
      - test
      - platform-test
      - race-and-coverage
      - lint
      - smoke
      - cross-build
      - reproducible-build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm required jobs passed
        env:
          POLICY_RESULT: ${{ needs.contribution-policy.result }}
          SOURCE_RESULT: ${{ needs.source-quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PLATFORM_RESULT: ${{ needs.platform-test.result }}
          RACE_RESULT: ${{ needs.race-and-coverage.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          CROSS_RESULT: ${{ needs.cross-build.result }}
          REPRO_RESULT: ${{ needs.reproducible-build.result }}
        run: |
          if [[ "$POLICY_RESULT" != "success" && "$POLICY_RESULT" != "skipped" ]]; then
            exit 1
          fi
          [[ "$SOURCE_RESULT" == "success" ]]
          [[ "$TEST_RESULT" == "success" ]]
          [[ "$PLATFORM_RESULT" == "success" ]]
          [[ "$RACE_RESULT" == "success" ]]
          [[ "$LINT_RESULT" == "success" ]]
          [[ "$SMOKE_RESULT" == "success" ]]
          [[ "$CROSS_RESULT" == "success" ]]
          [[ "$REPRO_RESULT" == "success" ]]
